<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Panel patrol_fsm (v0)</title>
<style>
  body { font-family: sans-serif; background: #1e1e1e; color: #eee; margin: 0; padding: 20px; }
  h1 { font-size: 1.2rem; font-weight: normal; color: #999; }
  #layout { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  canvas { border: 1px solid #444; background: #000; image-rendering: pixelated; }
  #panel { min-width: 220px; }
  #estado { font-size: 1.4rem; font-weight: bold; padding: 10px; border-radius: 6px; margin-bottom: 12px; text-align: center; }
  .estado-EN_BASE { background: #333; color: #ccc; }
  .estado-EN_RONDA { background: #1b5e20; color: #fff; }
  .estado-PAUSADO { background: #8a6d00; color: #fff; }
  .estado-MANUAL { background: #01579b; color: #fff; }
  .estado-RETORNO { background: #4a148c; color: #fff; }
  .estado-FALLA { background: #b71c1c; color: #fff; }
  .estado-INTERRUMPIDO { background: #e65100; color: #fff; }
  .estado-desconocido { background: #000; color: #666; border: 1px dashed #444; }
  button { display: block; width: 100%; margin-bottom: 8px; padding: 10px; font-size: 1rem;
           background: #333; color: #eee; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
  button:hover:not(:disabled) { background: #444; }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  #conexion { font-size: 0.85rem; color: #888; margin-top: 16px; }
  #conexion .ok { color: #4caf50; }
  #conexion .mal { color: #f44336; }
  #logout { font-size: 0.8rem; color: #888; margin-top: 16px; display: block; }
  #eventos { min-width: 320px; max-width: 420px; }
  #eventos h2 { font-size: 1rem; font-weight: normal; color: #999; margin: 0 0 8px; }
  #lista-eventos { list-style: none; margin: 0; padding: 0; max-height: 560px; overflow-y: auto; }
  #lista-eventos li { padding: 6px 8px; margin-bottom: 4px; border-radius: 4px; font-size: 0.85rem;
                       border-left: 3px solid #555; background: #2a2a2a; }
  #lista-eventos .ts { color: #888; margin-right: 6px; }
  #lista-eventos .campos { color: #999; }
  #lista-eventos .sev-alarma { border-left-color: #f44336; background: #3a1f1f; }
  #lista-eventos .sev-aviso { border-left-color: #e6a700; background: #332c1a; }
  #lista-eventos .sev-ok { border-left-color: #4caf50; }
  #eventos-vacio { color: #666; font-size: 0.85rem; }
</style>
</head>
<body>
  <h1>patrol_fsm — panel v0 (mapa: depot)</h1>
  <div id="layout">
    <canvas id="mapa" width="1210" height="618"></canvas>
    <div id="panel">
      <div id="estado" class="estado-desconocido">sin datos</div>
      <button id="btn-start" disabled>Iniciar ronda</button>
      <button id="btn-pause" disabled>Pausar</button>
      <button id="btn-resume" disabled>Reanudar</button>
      <button id="btn-return" disabled>Retornar a base</button>
      <button id="btn-clear" disabled>Limpiar falla</button>
      <div id="conexion">conectando...</div>
      <a id="logout" href="/logout">Cerrar sesión</a>
    </div>
    <div id="eventos">
      <h2>Eventos recientes</h2>
      <div id="eventos-vacio">todavía no llegó ninguno</div>
      <ul id="lista-eventos"></ul>
    </div>
  </div>

<script>
// depot.yaml: resolution 0.05 m/px, origin [-7.99, -6.67, 0], imagen 605x309 px
const MAP_RESOLUTION = 0.05;
const MAP_ORIGIN_X = -7.99;
const MAP_ORIGIN_Y = -6.67;
const MAP_IMG_W = 605;
const MAP_IMG_H = 309;
const SCALE = 2; // el canvas se dibuja al doble para que se vea mejor

// -- mapa + posicion --
const canvas = document.getElementById('mapa');
const ctx = canvas.getContext('2d');
const mapImg = new Image();
mapImg.src = 'depot.png';
let lastPos = null; // {x, y, yaw}

function mapToPixel(x, y) {
  const px = (x - MAP_ORIGIN_X) / MAP_RESOLUTION;
  const pyFromBottom = (y - MAP_ORIGIN_Y) / MAP_RESOLUTION;
  const py = MAP_IMG_H - pyFromBottom;
  return [px * SCALE, py * SCALE];
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(mapImg, 0, 0, MAP_IMG_W * SCALE, MAP_IMG_H * SCALE);
  if (lastPos) {
    const [px, py] = mapToPixel(lastPos.x, lastPos.y);
    ctx.beginPath();
    ctx.arc(px, py, 8, 0, 2 * Math.PI);
    ctx.fillStyle = '#ff3b30';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    // linea corta indicando orientacion (yaw)
    const len = 18;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(px + len * Math.cos(lastPos.yaw), py - len * Math.sin(lastPos.yaw));
    ctx.strokeStyle = '#ff3b30';
    ctx.lineWidth = 3;
    ctx.stroke();
  }
}
mapImg.onload = draw;

// -- estado + botones --
const estadoDiv = document.getElementById('estado');
const buttons = {
  start: document.getElementById('btn-start'),
  pause: document.getElementById('btn-pause'),
  resume: document.getElementById('btn-resume'),
  return_to_base: document.getElementById('btn-return'),
  clear_failure: document.getElementById('btn-clear'),
};

// que botones tienen sentido segun el estado actual (misma tabla que patrol_fsm/README.md)
const ENABLED_BY_STATE = {
  EN_BASE:      ['start'],
  EN_RONDA:     ['pause', 'return_to_base'],
  PAUSADO:      ['resume', 'return_to_base'],
  MANUAL:       [],
  RETORNO:      ['pause'],
  FALLA:        ['clear_failure'],
  // aterrizaje de un reinicio a media ronda/retorno, todavia intentando
  // reanudarse solo -- un humano puede intervenir de las 3 formas
  INTERRUMPIDO: ['resume', 'pause', 'return_to_base'],
};

function setEstado(estado) {
  estadoDiv.textContent = estado;
  estadoDiv.className = 'estado-' + estado;
  const enabled = ENABLED_BY_STATE[estado] || [];
  for (const [cmd, btn] of Object.entries(buttons)) {
    btn.disabled = !enabled.includes(cmd);
  }
}

// -- eventos (libro de rondas en vivo) --
// severidad solo para pintar la lista -- la logica real de "esto es una
// alarma que hay que reconocer" todavia no existe, queda para mas
// adelante (ver README). Por ahora es nada mas una senal visual.
const SEVERIDAD_POR_EVENTO = {
  localizacion_perdida: 'alarma',
  goal_failed: 'aviso',
  reiniciado: 'aviso',
  auto_resume_esperando_localizacion: 'aviso',
  falla_reconocida: 'ok',
  guardado_estado_fallido: 'alarma',
  disco_casi_lleno: 'aviso',
  disco_normalizado: 'ok',
  enlace_perdido: 'aviso',
  enlace_perdido_prolongado: 'alarma',
  enlace_restablecido: 'ok',
};
const MAX_EVENTOS_EN_LISTA = 30;

const eventosVacioDiv = document.getElementById('eventos-vacio');
const listaEventos = document.getElementById('lista-eventos');

function agregarEvento(data) {
  eventosVacioDiv.style.display = 'none';

  const li = document.createElement('li');
  const severidad = SEVERIDAD_POR_EVENTO[data.event] || 'info';
  li.className = 'sev-' + severidad;

  const hora = (data.ts || '').slice(11, 19) || '--:--:--';
  const campos = Object.entries(data)
    .filter(([k]) => !['ts', 'round_id', 'event'].includes(k))
    .map(([k, v]) => `${k}=${v}`)
    .join(' ');

  li.innerHTML = `<span class="ts">${hora}</span><strong>${data.event}</strong>` +
    (campos ? ` <span class="campos">${campos}</span>` : '');

  listaEventos.insertBefore(li, listaEventos.firstChild);
  while (listaEventos.children.length > MAX_EVENTOS_EN_LISTA) {
    listaEventos.removeChild(listaEventos.lastChild);
  }
}

// -- WebSocket propio contra el backend (server.py) --
// OJO: esto ya NO es una conexion MQTT directa. El navegador le habla a
// nuestro propio backend por WebSocket; el backend es el unico que tiene
// la contrasena real de Mosquitto y la usa de su lado, nunca la manda
// para aca. Ver panel/README.md.
//
// "conectado al backend" tampoco significa "el robot esta prendido" --
// por eso se trackea por separado si alguna vez llego una senal real del
// robot (state o heartbeat), y los botones quedan deshabilitados hasta
// que eso pase.
const conexionDiv = document.getElementById('conexion');
const wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
let ws = new WebSocket(wsUrl);

let backendConectado = false;
let ultimaSenalRobot = 0; // timestamp del ultimo state O heartbeat recibido (lo que sea)

function actualizarIndicadorConexion() {
  if (!backendConectado) {
    conexionDiv.innerHTML = '<span class="mal">conectando al panel...</span>';
    return;
  }
  if (ultimaSenalRobot === 0) {
    conexionDiv.innerHTML = '<span class="mal">conectado, pero sin señal del robot ' +
      '— ¿patrol_node/comms_agent están corriendo?</span>';
    return;
  }
  const segundos = (Date.now() - ultimaSenalRobot) / 1000;
  if (segundos > 15) {
    conexionDiv.innerHTML = `<span class="mal">sin señal del robot hace ${segundos.toFixed(0)}s — ¿se cayó?</span>`;
  } else {
    conexionDiv.innerHTML = '<span class="ok">conectado, robot activo</span>';
  }
}

ws.onopen = () => {
  backendConectado = true;
  actualizarIndicadorConexion();
};

ws.onerror = () => {
  conexionDiv.innerHTML = '<span class="mal">error de conexión con el panel</span>';
};

ws.onclose = () => {
  backendConectado = false;
  conexionDiv.innerHTML = '<span class="mal">desconectado del panel — recargá la página</span>';
};

ws.onmessage = (event) => {
  let msg;
  try {
    msg = JSON.parse(event.data);
  } catch (e) {
    return;
  }
  if (msg.type === 'state') {
    ultimaSenalRobot = Date.now();
    setEstado(msg.data);
  } else if (msg.type === 'position') {
    lastPos = msg.data;
    draw();
  } else if (msg.type === 'heartbeat') {
    ultimaSenalRobot = Date.now();
  } else if (msg.type === 'event') {
    agregarEvento(msg.data);
  }
};

setInterval(actualizarIndicadorConexion, 3000);

for (const [cmd, btn] of Object.entries(buttons)) {
  btn.addEventListener('click', () => {
    if (ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'cmd', data: cmd }));
    }
  });
}
</script>
</body>
</html>
